name: Generate screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject main and non-branch refs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "branch" || "$REF_NAME" == "main" ]]; then
            echo "::error::Screenshot generation is allowed only on branches other than main."
            exit 1
          fi

  generate:
    needs: validate-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Record screenshots
        run: xvfb-run --auto-servernum ./gradlew :shared:recordRoborazziJvm

      - name: Verify generated screenshots
        run: xvfb-run --auto-servernum ./gradlew :shared:verifyRoborazziJvm

      - name: Commit and push screenshots
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- shared/src/jvmTest/screenshots/
          if git diff --cached --quiet; then
            echo "Screenshot references are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update screenshot references on Ubuntu"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Upload screenshot reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: generated-screenshot-reports
          path: |
            shared/src/jvmTest/screenshots/
            shared/build/reports/roborazzi/
            shared/build/outputs/roborazzi/
            shared/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
          retention-days: 14
