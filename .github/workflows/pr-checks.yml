name: PR checks

on:
  pull_request:
    branches: [ main, master ]

jobs:
  screenshot-tests:
    name: Screenshot tests
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Verify screenshots
        run: ./gradlew.bat :shared:verifyRoborazziJvm

      - name: Upload screenshot reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshot-test-reports
          path: |
            shared/build/reports/roborazzi/
            shared/build/outputs/roborazzi/
            shared/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
          retention-days: 14

  build-android:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON repository secret" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

      - name: Build Android
        run: ./gradlew assembleDebug

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build iOS
        run: ./gradlew linkReleaseFrameworkIosArm64

  build-js:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build js
        run: ./gradlew :webApp:jsBrowserProductionWebpack

  build-jvm:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build jvm
        run: ./gradlew jvmJar

  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck
