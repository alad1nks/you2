name: PR checks

on:
  pull_request:
    branches: [ main, master ]

jobs:
  firestore-rules:
    name: Firestore and Storage security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'
      - run: npm ci
        working-directory: firebase-tests
      - run: npm test
        working-directory: firebase-tests

  screenshot-tests:
    name: Screenshot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Verify screenshots
        run: xvfb-run --auto-servernum ./gradlew :shared:verifyRoborazziJvm

      - name: Upload screenshot reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshot-test-reports
          path: |
            shared/build/reports/roborazzi/
            shared/build/outputs/roborazzi/
            shared/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
          retention-days: 14

  build-android:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON repository secret" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

      - name: Build Android
        run: ./gradlew assembleDebug

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build iOS
        run: ./gradlew linkReleaseFrameworkIosArm64

      # Compile the Swift host and its Firebase bridge as well as the Kotlin framework.
      # Firebase configuration is only needed when running, not for this unsigned build.
      - name: Build iOS simulator app
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  build-js:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build js
        run: ./gradlew :webApp:jsBrowserProductionWebpack

  web-firestore:
    name: Web Firestore and Storage integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'
      - run: npm ci
        working-directory: firebase-tests
      - name: Run browser tests against the demo emulator
        run: >-
          firebase-tests/node_modules/.bin/firebase emulators:exec
          --config firebase.json --project demo-you2 --only firestore,storage
          "./gradlew :shared:jsBrowserTest"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: web-firestore-test-reports
          path: shared/build/reports/tests/jsBrowserTest/

  build-jvm:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build jvm
        run: ./gradlew jvmJar :desktopApp:compileJava :desktopApp:test

  desktop-auth-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Test desktop credential storage with the JDK 25 toolchain
        run: .\gradlew.bat :desktopApp:test

  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck
