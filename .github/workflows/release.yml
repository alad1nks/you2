name: Release

on:
  push:
    branches: [ release/* ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON repository secret" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

      - name: Run local tests
        run: ./gradlew test

      - name: Build AAB
        run: ./gradlew bundleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: success()

      - name: Rename AAB
        run: mv androidApp/build/outputs/bundle/release/androidApp-release.aab androidApp/build/outputs/bundle/release/you2.aab
        if: success()

      - name: Upload AAB to GitHub
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-release
          path: androidApp/build/outputs/bundle/release/you2.aab
        if: success()

  post-build:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Checkout io repository
        uses: actions/checkout@v7.0.1
        with:
          repository: 'alad1nks/alad1nks.github.io'
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Download AAB
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-release
          path: you2

      - name: Commit AAB
        run: |
          git config --local user.name 'alad1nks'
          git config --local user.email 'alad1nks@users.noreply.github.com'
          git add you2/*.aab
          git commit -m 'Add generated AAB file'
          git push
